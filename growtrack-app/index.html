<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowTrack — 自我观察与成长量化</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__logo">
      <div class="sidebar__logo-icon">G</div>
      <span class="sidebar__logo-text">GrowTrack</span>
    </div>
    <nav class="sidebar__nav" id="nav">
      <a href="#/dashboard" class="nav-item" data-route="dashboard">
        <span class="nav-item__icon">📊</span>
        <span class="nav-item__label">仪表盘</span>
      </a>
      <a href="#/tracker" class="nav-item" data-route="tracker">
        <span class="nav-item__icon">⏱️</span>
        <span class="nav-item__label">时间追踪</span>
      </a>
      <a href="#/dimensions" class="nav-item" data-route="dimensions">
        <span class="nav-item__icon">📈</span>
        <span class="nav-item__label">成长维度</span>
      </a>
      <a href="#/goals" class="nav-item" data-route="goals">
        <span class="nav-item__icon">🎯</span>
        <span class="nav-item__label">目标管理</span>
      </a>
      <a href="#/skills" class="nav-item" data-route="skills">
        <span class="nav-item__icon">🌳</span>
        <span class="nav-item__label">技能路线</span>
      </a>
      <a href="#/projects" class="nav-item" data-route="projects">
        <span class="nav-item__icon">🏆</span>
        <span class="nav-item__label">项目挑战</span>
      </a>
      <a href="#/review" class="nav-item" data-route="review">
        <span class="nav-item__icon">📝</span>
        <span class="nav-item__label">复盘报告</span>
      </a>
      <a href="#/habits" class="nav-item" data-route="habits">
        <span class="nav-item__icon">✅</span>
        <span class="nav-item__label">习惯打卡</span>
      </a>
    </nav>
    <div class="sidebar__footer">
      <div class="sidebar__streak">
        <span class="sidebar__streak-icon">🔥</span>
        <span class="sidebar__streak-text">连续学习 23 天</span>
      </div>
    </div>
  </aside>

  <div class="mobile-header" id="mobileHeader">
    <button class="mobile-menu-btn" id="menuBtn">☰</button>
    <span class="mobile-header__title">GrowTrack</span>
  </div>

  <main class="main-content" id="mainContent">
    <div class="page-container" id="pageContainer">
    </div>
  </main>
</div>

<div class="overlay" id="overlay"></div>

<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
